<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline · QCNet Ticketing</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
               background: linear-gradient(135deg, #4338ca, #4f46e5, #0ea5e9); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1e293b; }
        .card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, .2); }
        img { width: 56px; height: 56px; border-radius: 14px; }
        h1 { margin: 16px 0 8px; font-size: 20px; }
        p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #64748b; }
        button { width: 100%; border: 0; border-radius: 10px; padding: 12px; background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>Tidak ada koneksi</h1>
        <p>QCNet Ticketing butuh internet untuk menampilkan tiket terbaru. Cek koneksi HP, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
